name: Deploy web menu to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # Keep __pycache__ bytecode out of the uploaded Pages artifact.
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      # Only what the suites import: requirements.txt also lists PySide6, which the
      # CI build does not need and which requires system libraries.
      - name: Install the Python test dependencies
        run: python -m pip install requests beautifulsoup4
      - name: Run the Python tests
        run: python -m unittest discover -s tests -v
      - name: Run the Node tests
        run: node --test
      - name: Build listing.json from the Scratch API
        run: python web/listing.py --with-details --out listing.json
      - name: Verify Pages root entry
        run: test -f index.html && test -f listing.json && git ls-files --error-unmatch listing.json && test -f web/app.js && test -f web/auth.js && test -f web/style.css
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment