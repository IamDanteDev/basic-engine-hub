<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Basic Engine Hub Player</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root { color-scheme: dark; }
  html, body { margin: 0; width: 100%; height: 100%; background: #FF4D4D;
               color: #e8e8e8; font-family: system-ui, -apple-system,
               "Segoe UI", sans-serif; overflow: hidden; }
  #player-root { position: fixed; inset: 0; }
  #player-root:fullscreen { width: 100vw; height: 100vh; }
  #stage { position: fixed; inset: 0; display: grid; place-items: center; }
  #overlay { position: fixed; inset: 0; z-index: 45; display: grid;
             place-items: center; background: rgba(16,18,22,0.55);
             transition: opacity 0.15s ease; }
  #overlay.hidden { opacity: 0; pointer-events: none; }
  #overlay-text { padding: 14px 22px; border: 1px solid #2b2f36;
                  border-radius: 10px; background: #181c22; font-size: 15px;
                  text-align: center; }
  #fs-exit { position: fixed; top: 12px; left: 12px; z-index: 40; width: 34px;
             height: 34px; border-radius: 17px; border: 1px solid #2b2f36;
             background: #181c22; color: #e8e8e8; font-size: 15px;
             cursor: pointer; display: none; align-items: center;
             justify-content: center; }
  body.fs-active #fs-exit { display: flex; }
  #clones-panel { position: fixed; left: 12px; top: 50%; transform: translateY(-50%);
                  z-index: 15; width: 220px; max-height: 75%; overflow-y: auto;
                  border: 1px solid #2b2f36; border-radius: 10px;
                  background: #181c22; padding: 10px; font-size: 12px; }
  #clones-panel.hidden { display: none; }
  .clone-group-title { font-weight: 600; color: #ff8c42; margin: 6px 0 2px; }
  .clone-row { color: #cfd3da; font-family: ui-monospace, monospace; padding: 1px 0; }
  .clone-empty { color: #9aa0a8; text-align: center; padding: 8px 0; }

  /* TurboWarp chrome, dark ----------------------------------------------------
     Scaffolding hardcodes a light UI for the pieces it draws around the stage:
     the variable/list monitors, the "ask and wait" prompt and the stage context
     menu. Its stylesheet is injected as #sc-styles when the bundle loads, after
     this block, so each override carries an extra element type (`body .sc-...`
     beats the bundle's bare class) instead of depending on the order. */
  body .sc-monitor-root { background: #181c22; color: #cfd3da; border-color: #2b2f36; }
  body .sc-monitor-list-label { background-color: #1f242c; border-bottom-color: #2b2f36; }
  body .sc-monitor-list-footer { background-color: #1f242c; }
  body .sc-question-root { color: #e8e8e8; }
  body .sc-question-inner { background: #181c22; border-color: #2b2f36; }
  body .sc-question-input { border-color: #2b2f36; }
  body .sc-context-menu { color: #e8e8e8; box-shadow: 0 0 5px 1px hsla(0, 0%, 0%, 0.6); }
  body .sc-context-menu-item { background-color: #181c22; }
</style>
</head>
<body>
<div id="player-root">
  <div id="stage"></div>
  <button id="fs-exit" type="button" aria-label="Salir de pantalla completa" data-i18n-aria-label="fsExit" title="Salir de pantalla completa" data-i18n-title="fsExit">✕</button>
  <div id="clones-panel" class="hidden"></div>
  <div id="overlay"><div id="overlay-text">Elige un proyecto</div></div>
</div>
<script src="i18n.js"></script>
<script src="vendor/scaffolding-with-music.js"></script>
<script>
"use strict";

// UI language: the shared core (web/i18n.js) resolves it in this order — the
// ?lang=<code> the desktop shell appends, then the stored choice, then the
// default. The shell switches it live through window.setPlayerLanguage(lang).
// This page owns no strings of its own any more: it asks the same table the
// menu uses, so a language the app offers is a language the player speaks.
const tr = (key) => (typeof I18n === "undefined" ? key : I18n.tr(key));

const overlayTextEl = document.getElementById("overlay-text");

/* Re-apply every visible web-owned text. The static hooks (the fullscreen
 * button) and the document language are the core's job; the overlay is the one
 * dynamic surface, and only the pre-project prompt can be re-applied verbatim
 * because the loading and error texts are transient and the error one embeds a
 * raw message. */
function applyPlayerLanguage() {
  if (typeof I18n !== "undefined") I18n.apply(document);
  const overlay = document.getElementById("overlay");
  const vm = scaffolding && scaffolding.vm;
  if (overlay && !overlay.classList.contains("hidden") &&
      (!vm || !vm.runtime || !vm.runtime.targets)) {
    showOverlay(tr("selectProject"));
  }
  if (clonesVisible) renderClones();
}

// Apply the initial copy so a non-default language never flashes.
if (overlayTextEl) overlayTextEl.textContent = tr("selectProject");
if (typeof I18n !== "undefined") I18n.onChange(applyPlayerLanguage);

let scaffolding = null;
let storage = null;

function showOverlay(text) {
  const el = document.getElementById("overlay-text");
  if (el) el.textContent = text;
  document.getElementById("overlay").classList.remove("hidden");
}

function hideOverlay() {
  document.getElementById("overlay").classList.add("hidden");
}

// Keep the stage size fixed while retaining Scaffolding's normal runtime limits.
const twconfig = {
  "width": 640,
  "height": 360
}; // _twconfig_

function applyTwConfig() {
  if (!scaffolding) return;
  scaffolding.width = twconfig.width;
  scaffolding.height = twconfig.height;
}

function boot() {
  if (typeof Scaffolding === "undefined") {
    showOverlay(tr("bundleMissing"));
    return;
  }
  scaffolding = new Scaffolding.Scaffolding();
  scaffolding.width = twconfig.width;
  scaffolding.height = twconfig.height;
  // Fixed internal 640x360 (16:9): the stage resolution never changes.
  // preserve-ratio scales the rendered stage to fit the container
  // (letterboxed), so resizing the window never deforms the project.
  scaffolding.resizeMode = "preserve-ratio";
  scaffolding.usePackagedRuntime = false;
  scaffolding.setup();
  // TurboWarp ships a white stage: its renderer clears to white, so everything
  // around the 16:9 stage -- and the whole player until a project loads -- came
  // up light on a page that is dark. Clear to this page's background instead.
  if (scaffolding.renderer && scaffolding.renderer.setBackgroundColor) {
    scaffolding.renderer.setBackgroundColor(16 / 255, 18 / 255, 22 / 255); // #101216
  }
  applyTwConfig();
  scaffolding.appendTo(document.getElementById("stage"));
  storage = scaffolding.storage;
  storage.addWebStore(
    [
      storage.AssetType.ImageVector,
      storage.AssetType.ImageBitmap,
      storage.AssetType.Sound
    ],
    (asset) =>
      `https://assets.scratch.mit.edu/internalapi/asset/${asset.assetId}.${asset.dataFormat}/get/`
  );
  showOverlay(tr("selectProject"));
}

async function loadScratchProject(id) {
  if (!scaffolding) {
    showOverlay(tr("bundleMissing"));
    return "error: scaffolding bundle missing";
  }
  try {
    showOverlay(tr("playerLoading"));
    const response = await fetch("/projects/" + encodeURIComponent(id) + ".sb3");
    if (!response.ok) throw new Error("HTTP " + response.status);
    const buffer = await response.arrayBuffer();
    return await loadScratchProjectBytes(buffer);
  } catch (err) {
    showOverlay(tr("errorPrefix") + err.message);
    return "error: " + err.message;
  }
}

async function loadScratchProjectBytes(buffer) {
  if (!scaffolding) {
    showOverlay(tr("bundleMissing"));
    return "error: scaffolding bundle missing";
  }
  try {
    showOverlay(tr("playerLoading"));
    await scaffolding.loadProject(buffer);
    hideOverlay();
    return "ok";
  } catch (err) {
    showOverlay(tr("errorPrefix") + err.message);
    return "error: " + err.message;
  }
}

function greenFlag() {
  if (scaffolding) scaffolding.greenFlag();
}

function stopAll() {
  if (scaffolding) scaffolding.stopAll();
}

function pausePlayer() {
  // Freeze the VM stepping loop without killing scripts (true pause).
  if (scaffolding && scaffolding.vm && scaffolding.vm.runtime &&
      scaffolding.vm.runtime.frameLoop) {
    scaffolding.vm.runtime.frameLoop.stop();
  }
}

function resumePlayer() {
  if (scaffolding && scaffolding.vm && scaffolding.vm.runtime &&
      scaffolding.vm.runtime.frameLoop) {
    scaffolding.vm.runtime.frameLoop.start();
  }
}

window.loadScratchProject = loadScratchProject;
window.loadScratchProjectBytes = loadScratchProjectBytes;
window.greenFlag = greenFlag;
window.stopAll = stopAll;
window.pausePlayer = pausePlayer;
window.resumePlayer = resumePlayer;

// Clones panel ----------------------------------------------------
let clonesVisible = false;
let clonesTimer = null;

function renderClones() {
  const panel = document.getElementById("clones-panel");
  if (!panel) return;
  const vm = scaffolding && scaffolding.vm;
  const targets = vm && vm.runtime && vm.runtime.targets;
  panel.replaceChildren();
  if (!targets) {
    const empty = document.createElement("div");
    empty.className = "clone-empty";
    empty.textContent = tr("noProject");
    panel.appendChild(empty);
    return;
  }
  const clones = targets.filter(function (t) { return t && !t.isStage && !t.isOriginal; });
  if (clones.length === 0) {
    const empty = document.createElement("div");
    empty.className = "clone-empty";
    empty.textContent = tr("noActiveClones");
    panel.appendChild(empty);
    return;
  }
  const bySprite = new Map();
  for (const c of clones) {
    const name = (c.sprite && c.sprite.name) || "?";
    if (!bySprite.has(name)) bySprite.set(name, []);
    bySprite.get(name).push(c);
  }
  for (const [name, list] of bySprite) {
    const title = document.createElement("div");
    title.className = "clone-group-title";
    title.textContent = name;
    panel.appendChild(title);
    for (const c of list) {
      const row = document.createElement("div");
      row.className = "clone-row";
      row.textContent = "x: " + Math.round(c.x) + "  y: " + Math.round(c.y);
      panel.appendChild(row);
    }
  }
}

function toggleClonesPanel() {
  clonesVisible = !clonesVisible;
  const panel = document.getElementById("clones-panel");
  if (!panel) return;
  if (clonesVisible) {
    panel.classList.remove("hidden");
    renderClones();
    clonesTimer = setInterval(renderClones, 200);
    if (typeof window.toggleClonesButtonState === "function") window.toggleClonesButtonState(true);
  } else {
    panel.classList.add("hidden");
    if (clonesTimer) { clearInterval(clonesTimer); clonesTimer = null; }
  }
}
window.toggleClonesPanel = toggleClonesPanel;

function getCloneCount() {
  const vm = scaffolding && scaffolding.vm;
  const targets = vm && vm.runtime && vm.runtime.targets;
  if (!targets) return 0;
  return targets.filter(function (t) { return t && !t.isStage && !t.isOriginal; }).length;
}
window.getCloneCount = getCloneCount;

// Fullscreen ------------------------------------------------------
function enterFullscreen() {
  const root = document.getElementById("player-root");
  if (root && typeof root.requestFullscreen === "function" && !document.fullscreenElement) {
    root.requestFullscreen();
  }
}
function exitFullscreen() {
  if (document.fullscreenElement) document.exitFullscreen();
}
window.enterFullscreen = enterFullscreen;
window.exitFullscreen = exitFullscreen;

document.addEventListener("fullscreenchange", function () {
  document.body.classList.toggle("fs-active", !!document.fullscreenElement);
});
document.getElementById("fs-exit").addEventListener("click", exitFullscreen);

// Session-only variable persistence: { projectId: { variableId: value } }
const savedValuesByProject = {};   // { projectId: { variableId: value } } — session-only
let currentProjectId = null;       // var id currently loaded in the player

function findVariable(id) {
  if (!scaffolding || !scaffolding.vm || !scaffolding.vm.runtime) return null;
  for (const target of scaffolding.vm.runtime.targets) {
    if (!target.variables) continue;
    // Vendored VM keeps variables as plain {id: Variable} objects; also accept
    // a Map shape (get) in case a future bundle switches back.
    const variable = Object.prototype.hasOwnProperty.call(target.variables, id)
      ? target.variables[id]
      : (typeof target.variables.get === "function" ? target.variables.get(id) : null);
    if (variable) return variable;
  }
  return null;
}

function listVariables() {
  const out = [];
  if (!scaffolding || !scaffolding.vm || !scaffolding.vm.runtime) return out;
  for (const target of scaffolding.vm.runtime.targets) {
    if (!target.variables) continue;
    const variables =
      typeof target.variables.values === "function"
        ? target.variables.values()
        : Object.values(target.variables);
    for (const variable of variables) {
      out.push({
        id: variable.id,
        name: variable.name,
        target: (target.getName && target.getName()) || "",
        value: variable.value,           // scalar for variables, JS array for lists
        isCloud: !!variable.isCloud,
        kind: Array.isArray(variable.value) ? "list" : "variable"
      });
    }
  }
  return out;
}
window.listVariables = listVariables;

function setVariableValue(id, value) {
  try {
    const variable = findVariable(id);
    if (!variable) return false;
    // Coerce to the shapes tw-vm expects so a bad edit can never poison a
    // variable: scalars hold string/number/boolean, lists hold scalar arrays.
    const isList = Array.isArray(variable.value);
    let next;
    if (isList) {
      const source = Array.isArray(value) ? value : [value];
      next = source.map((entry) => {
        const t = typeof entry;
        return t === "string" || t === "number" || t === "boolean" ? entry : String(entry);
      });
    } else {
      const t = typeof value;
      next = t === "string" || t === "number" || t === "boolean" ? value : String(value);
    }
    if (variable.isCloud) next = String(next); // cloud values are strings
    if (typeof variable.setValue === "function") {
      variable.setValue(next); // emits value-changed; monitors update immediately
    } else {
      variable.value = next;
    }
    const runtime = scaffolding && scaffolding.vm && scaffolding.vm.runtime;
    if (runtime && typeof runtime.requestUpdateMonitorMap === "function") runtime.requestUpdateMonitorMap();
    return true;
  } catch (err) {
    return "error: " + (err && err.message ? err.message : String(err));
  }
}
window.setVariableValue = setVariableValue;

async function switchProject(oldPid, oldSavedIds, newPid, newSavedIds) {
  try {
    if (scaffolding) {
      // 1) snapshot the values of the checked variables of the project we are leaving
      if (oldPid != null && Array.isArray(oldSavedIds)) {
        const cache = (savedValuesByProject[oldPid] = savedValuesByProject[oldPid] || {});
        for (const id of oldSavedIds) {
          const variable = findVariable(id);
          if (variable) cache[id] = variable.value;
        }
      }
      // 2) stop all scripts so old sprites/monitors stop showing old state
      if (typeof scaffolding.stopAll === "function") scaffolding.stopAll();
    }
    showOverlay(tr("playerLoading"));
    const response = await fetch("/projects/" + encodeURIComponent(newPid) + ".sb3");
    if (!response.ok) throw new Error("HTTP " + response.status);
    const buffer = await response.arrayBuffer();
    await scaffolding.loadProject(buffer);
    // 3) restore the checked variables saved for the project we are entering
    const saved = savedValuesByProject[newPid] || {};
    for (const id of newSavedIds || []) {
      if (Object.prototype.hasOwnProperty.call(saved, id)) {
        const variable = findVariable(id);
        if (variable) variable.value = saved[id];
      }
    }
    currentProjectId = newPid;
    hideOverlay();
    return "ok";
  } catch (err) {
    showOverlay(tr("errorPrefix") + err.message);
    return "error: " + err.message;
  }
}
window.switchProject = switchProject;

// Language switch from the desktop shell: hand it to the core, which notifies
// every surface (this page's own re-apply above, and the menu's if it is open).
window.setPlayerLanguage = function (lang) {
  if (typeof I18n === "undefined" || !I18n.isKnownCode(lang)) return;
  I18n.setLanguage(lang);
};

boot();
</script>
</body>
</html>
